# Redis UI Cluster Configuration
# Purpose: Ephemeral UI state — rate limiting counters, 2FA attempt locks, session tokens.
# Policy: allkeys-lru eviction under memory pressure. Graceful degradation preferred over OOM.

# Memory (Strict cap to prevent UI traffic from exhausting host resources)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Durability (Ephemeral data; persistence optional but enabled for crash recovery)
appendonly yes
appendfsync everysec
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Network
bind 0.0.0.0
protected-mode yes
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Security (password set via --requirepass flag in docker-compose)
