  grafana:
    image: grafana/grafana:11.6.0@sha256:62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: 'https://grafana.${DOMAIN}'
      # Provisioning is rendered at container start into a writable path
      # (see entrypoint below) because /etc/grafana/provisioning-templates
      # is mounted read-only and the alerting contact point is generated
      # from DISCORD_WEBHOOK_URL/TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID.
      # Dashboard JSON is the exception: it is read straight from the
      # read-only mount, so it never goes stale after a deploy.
      GF_PATHS_PROVISIONING: /tmp/grafana-provisioning
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning-templates:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mkdir -p /tmp/grafana-provisioning/dashboards /tmp/grafana-provisioning/datasources /tmp/grafana-provisioning/alerting
        # Only the provider file is rendered here. The dashboard JSON is read
        # in place from the read-only mount - see the path in dashboards.yml.
        cp /etc/grafana/provisioning-templates/dashboards/dashboards.yml /tmp/grafana-provisioning/dashboards/
        cp -r /etc/grafana/provisioning-templates/datasources/. /tmp/grafana-provisioning/datasources/

        # Grafana does not fail on a provider path that holds no dashboards:
        # it logs "Cannot read directory" every 30s and serves an empty list.
        # That is how every dashboard went missing unnoticed once, so a wrong
        # or empty path stops the container here instead.
        DASHBOARDS_DIR=$$(sed -n 's/^ *path: *//p' /tmp/grafana-provisioning/dashboards/dashboards.yml)
        if ! ls "$$DASHBOARDS_DIR"/*.json >/dev/null 2>&1; then
          echo "[Grafana] ERROR: dashboards.yml points at '$$DASHBOARDS_DIR', which holds no *.json dashboards." >&2
          exit 1
        fi

        RECEIVERS=""
        if [ -n "$$DISCORD_WEBHOOK_URL" ]; then
          RECEIVERS="$$RECEIVERS$$(printf '\n      - uid: notify-discord\n        type: discord\n        settings:\n          url: "%s"' "$$DISCORD_WEBHOOK_URL")"
        fi
        if [ -n "$$TELEGRAM_BOT_TOKEN" ] && [ -n "$$TELEGRAM_CHAT_ID" ]; then
          RECEIVERS="$$RECEIVERS$$(printf '\n      - uid: notify-telegram\n        type: telegram\n        settings:\n          bottoken: "%s"\n          chatid: "%s"' "$$TELEGRAM_BOT_TOKEN" "$$TELEGRAM_CHAT_ID")"
        fi
        # Grafana is a dashboards tool first: a missing alert channel degrades
        # alerting instead of blocking startup. The loud "you forgot to
        # configure ops alerting" signal is the alertmanager service, which
        # does refuse to start without a channel - it has no other purpose.
        if [ -n "$$RECEIVERS" ]; then
          cp /etc/grafana/provisioning-templates/alerting/policies.yml /tmp/grafana-provisioning/alerting/policies.yml
          {
            echo "apiVersion: 1"
            echo ""
            echo "contactPoints:"
            echo "  - orgId: 1"
            echo "    name: Notify"
            echo "    receivers:"
            printf '%s\n' "$$RECEIVERS"
          } > /tmp/grafana-provisioning/alerting/contact-points.yml
        else
          echo "[Grafana] WARNING: no DISCORD_WEBHOOK_URL / TELEGRAM_BOT_TOKEN set - dashboards will work, alert notifications are disabled." >&2
        fi

        exec /run.sh
    depends_on:
      - prometheus
      - loki
    networks:
      - backend_net
      - public_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=public_net'
      - 'traefik.http.services.grafana.loadbalancer.server.port=3000'
    logging: *loki-logging

