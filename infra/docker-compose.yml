name: quasar

x-logging: &loki-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  traefik-init:
    image: httpd:2.4.67-alpine@sha256:0136c2d4462f3b8ecc92bea70efdfef4d06523999ae8d7aa533969dea6db4576
    entrypoint: /bin/sh
    command:
      - -c
      - |
        htpasswd -nbB "$${TRAEFIK_USER}" "$${TRAEFIK_PASSWORD}" > /shared/users.txt
        echo "[traefik-init] users.txt generated"
    environment:
      TRAEFIK_USER: ${TRAEFIK_USER:-admin}
      TRAEFIK_PASSWORD: ${TRAEFIK_PASSWORD}
    volumes:
      - traefik_auth:/shared
    networks:
      - backend_net

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - SERVICES=1
      - SWARM=0
      - TASKS=0
      - VOLUMES=0
      - INFO=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend_net
    logging: *loki-logging

  traefik:
    image: traefik:v3.6.17@sha256:802adc80a7bb20a6766c9385c2ad547f0de98564cd20d31d0b6d8f726f906f66
    restart: unless-stopped
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
    volumes:
      - ./config/traefik/traefik.yml:/traefik.yml:ro
      - traefik_auth:/auth:ro
    depends_on:
      traefik-init:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    networks:
      - public_net
      - backend_net
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.middlewares.basic-auth.basicauth.usersfile=/auth/users.txt'
    logging: *loki-logging

  postgresql-primary:
    build:
      context: .
      dockerfile: ./dockerfiles/postgresql-repmgr/Dockerfile
    image: quasar/postgresql-repmgr:16
    restart: unless-stopped
    entrypoint: ['/entrypoint-primary.sh']
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://${S3_BUCKET_POSTGRES}/wal-g}
      AWS_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT must be set}
      AWS_REGION: ${S3_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?WALG_LIBSODIUM_KEY must be set}
      WALG_LIBSODIUM_KEY_TRANSFORM: ${WALG_LIBSODIUM_KEY_TRANSFORM:-base64}
      WALG_PREVENT_WAL_OVERWRITE: 'true'
      WALG_UPLOAD_CONCURRENCY: ${WALG_UPLOAD_CONCURRENCY:-2}
      WALG_DOWNLOAD_CONCURRENCY: ${WALG_DOWNLOAD_CONCURRENCY:-2}
      REPMGR_PRIMARY_HOST: ${REPMGR_PRIMARY_HOST:-postgresql-primary}
      REPMGR_PARTNER_NODES: postgresql-primary,postgresql-standby
      REPMGR_NODE_NAME: postgresql-primary
      REPMGR_NODE_NETWORK_NAME: postgresql-primary
      REPMGR_EVENT_NOTIFICATION_COMMAND: /usr/local/bin/pgbouncer_failover.sh %e %n %a "%t" "%d"
      REPMGR_NODE_ID: 1
      REPMGR_ROLE: ${REPMGR_ROLE:-primary}
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./dockerfiles/postgresql-repmgr/entrypoint-primary.sh:/entrypoint-primary.sh:ro
      - ./scripts/pgbouncer_failover.sh:/usr/local/bin/pgbouncer_failover.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-quasar} -d ${PG_DB:-quasar}']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
    cpus: 1.5
    mem_limit: 1536m
    logging: *loki-logging

  postgresql-standby:
    build:
      context: .
      dockerfile: ./dockerfiles/postgresql-repmgr/Dockerfile
    image: quasar/postgresql-repmgr:16
    restart: unless-stopped
    entrypoint: ['/entrypoint-standby.sh']
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
      REPMGR_PASSWORD: ${REPMGR_PASSWORD}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://${S3_BUCKET_POSTGRES}/wal-g}
      AWS_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT must be set}
      AWS_REGION: ${S3_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?WALG_LIBSODIUM_KEY must be set}
      WALG_LIBSODIUM_KEY_TRANSFORM: ${WALG_LIBSODIUM_KEY_TRANSFORM:-base64}
      WALG_PREVENT_WAL_OVERWRITE: 'true'
      WALG_UPLOAD_CONCURRENCY: ${WALG_UPLOAD_CONCURRENCY:-2}
      WALG_DOWNLOAD_CONCURRENCY: ${WALG_DOWNLOAD_CONCURRENCY:-2}
      REPMGR_PRIMARY_HOST: postgresql-primary
      REPMGR_PARTNER_NODES: postgresql-primary,postgresql-standby
      REPMGR_NODE_NAME: postgresql-standby
      REPMGR_NODE_NETWORK_NAME: postgresql-standby
      REPMGR_EVENT_NOTIFICATION_COMMAND: /usr/local/bin/pgbouncer_failover.sh %e %n %a "%t" "%d"
      REPMGR_NODE_ID: 2
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
      - ./dockerfiles/postgresql-repmgr/entrypoint-standby.sh:/entrypoint-standby.sh:ro
      - ./scripts/pgbouncer_failover.sh:/usr/local/bin/pgbouncer_failover.sh:ro
    depends_on:
      postgresql-primary:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-quasar} -d ${PG_DB:-quasar}']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    cpus: 1.0
    mem_limit: 1024m
    logging: *loki-logging

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0@sha256:c7bfcaa24de830e29588bb9ad1eb39cebaf07c27149e1974445899b695634bb4
    restart: unless-stopped
    ports:
      - '127.0.0.1:6432:5432'
    environment:
      DB_USER: ${PG_USER:-quasar}
      DB_PASSWORD: ${PG_PASSWORD}
      DB_HOST: postgresql-primary
      DB_NAME: ${PG_DB:-quasar}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      LISTEN_PORT: 5432
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${PG_USER:-quasar}
    depends_on:
      postgresql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${PG_USER:-quasar} -d ${PG_DB:-quasar} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    cpus: 0.5
    mem_limit: 512m
    logging: *loki-logging

  pgadmin:
    image: dpage/pgadmin4:9.15.0@sha256:cefc4cc6b7d9d71a9e81e76fb9d7e14038ab5661b539a190eea1b63fa612589a
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    entrypoint: /bin/sh
    command:
      - -c
      - |
        printf '{"Servers":{"1":{"Name":"Quasar Primary","Group":"Servers","Host":"postgresql-primary","Port":5432,"MaintenanceDB":"%s","Username":"%s","PassFile":"/tmp/pgpass","SSLMode":"prefer"},"2":{"Name":"Quasar Standby","Group":"Servers","Host":"postgresql-standby","Port":5432,"MaintenanceDB":"%s","Username":"%s","PassFile":"/tmp/pgpass","SSLMode":"prefer"}}}' "$${PG_DB}" "$${PG_USER}" "$${PG_DB}" "$${PG_USER}" > /tmp/servers.json
        printf 'postgresql-primary:5432:%s:%s:%s\npostgresql-standby:5432:%s:%s:%s\n' "$${PG_DB}" "$${PG_USER}" "$${PG_PASSWORD}" "$${PG_DB}" "$${PG_USER}" "$${PG_PASSWORD}" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        /entrypoint.sh
    depends_on:
      postgresql-primary:
        condition: service_healthy
    networks:
      - backend_net
      - public_net
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=public_net'
      - 'traefik.http.services.pgadmin.loadbalancer.server.port=80'
      - 'traefik.http.routers.pgadmin.middlewares=basic-auth@docker'
    logging: *loki-logging

  pg-backup:
    image: eeshugerman/postgres-backup-s3:16@sha256:cfcaa57732c13d0724312a2eea1ad3e385f5ed049de3c626d1ef28ecc13cdddb
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgresql-primary
      POSTGRES_DATABASE: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      SCHEDULE: ${PG_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${PG_BACKUP_KEEP_DAYS:-7}
      S3_REGION: ${S3_REGION:-auto}
      S3_S3V4: ${S3_S3V4:-yes}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET_POSTGRES}
      S3_PREFIX: 'backup'
      PASSPHRASE: ${PG_BACKUP_PASSPHRASE}
    volumes:
      - ./scripts/restore_backup.sh:/restore.sh:ro
    depends_on:
      postgresql-primary:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    cpus: 0.5
    mem_limit: 512m
    logging: *loki-logging

  wal-g-backup:
    image: quasar/postgresql-repmgr:16
    build:
      context: .
      dockerfile: ./dockerfiles/postgresql-repmgr/Dockerfile
    restart: unless-stopped
    # Do not inherit the PostgreSQL image entrypoint: this is a scheduler,
    # not a third database instance. It must never initialize or start a
    # cluster of its own.
    entrypoint: ['/bin/sh']
    command: ['/usr/local/bin/wal-g-backup-loop.sh']
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    user: root
    environment:
      REPMGR_PASSWORD: ${REPMGR_PASSWORD:?REPMGR_PASSWORD must be set}
      PGUSER: repmgr
      PGDATABASE: repmgr
      WALG_S3_PREFIX: ${WALG_S3_PREFIX:-s3://${S3_BUCKET_POSTGRES}/wal-g}
      AWS_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT must be set}
      AWS_REGION: ${S3_REGION:-auto}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
      WALG_LIBSODIUM_KEY: ${WALG_LIBSODIUM_KEY:?WALG_LIBSODIUM_KEY must be set}
      WALG_LIBSODIUM_KEY_TRANSFORM: ${WALG_LIBSODIUM_KEY_TRANSFORM:-base64}
      WALG_PREVENT_WAL_OVERWRITE: 'true'
      WALG_UPLOAD_CONCURRENCY: ${WALG_UPLOAD_CONCURRENCY:-2}
      WALG_DOWNLOAD_CONCURRENCY: ${WALG_DOWNLOAD_CONCURRENCY:-2}
      WALG_BACKUP_INTERVAL_SECONDS: ${WALG_BACKUP_INTERVAL_SECONDS:-86400}
      WALG_BACKUP_ON_START: ${WALG_BACKUP_ON_START:-yes}
      WALG_RETAIN_FULL_BACKUPS: ${WALG_RETAIN_FULL_BACKUPS:-7}
    volumes:
      - ./scripts/wal-g-backup-loop.sh:/usr/local/bin/wal-g-backup-loop.sh:ro
      - ./scripts/wal-g-pitr-restore.sh:/usr/local/bin/wal-g-pitr-restore.sh:ro
      - pg_primary_data:/var/lib/postgresql/primary:ro
      - pg_standby_data:/var/lib/postgresql/standby:ro
    depends_on:
      postgresql-primary:
        condition: service_healthy
      postgresql-standby:
        condition: service_started
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    cpus: 0.5
    mem_limit: 512m
    logging: *loki-logging

  # ── API Redis Cluster (Core Engine) ──────────────────────────────────────────
  redis-api-node-1:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --cluster-enabled ${REDIS_API_CLUSTER_ENABLED:-no} --requirepass ${REDIS_API_PASSWORD} --masterauth ${REDIS_API_PASSWORD} --cluster-announce-ip 172.19.99.11 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
    volumes:
      - redis_api_data_1:/data
      - ./config/redis/redis-api.conf:/usr/local/etc/redis/redis.conf:ro
    environment:
      REDISCLI_AUTH: ${REDIS_API_PASSWORD}
      REDIS_CLUSTER_ENABLED: ${REDIS_API_CLUSTER_ENABLED:-no}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      backend_net:
        ipv4_address: 172.19.99.11
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    cpus: 0.5
    mem_limit: 1024m
    logging: *loki-logging

  redis-api-node-2:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --cluster-enabled ${REDIS_API_CLUSTER_ENABLED:-no} --requirepass ${REDIS_API_PASSWORD} --masterauth ${REDIS_API_PASSWORD} --cluster-announce-ip 172.19.99.12 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
    volumes:
