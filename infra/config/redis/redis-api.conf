# Redis API Cluster Configuration
# Purpose: Core engine state — BullMQ queues, IronDome RPS counters, transaction tracking, quota management.
# Policy: NO eviction. Data integrity is paramount. AOF persistence enabled.

# Memory (Reconciled with 1GB container limit: 700MB data + 300MB AOF/COW/fragmentation headroom)
maxmemory 700mb
maxmemory-policy noeviction

# Durability (Critical state must persist)
appendonly yes
appendfsync everysec
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Network
bind 0.0.0.0
protected-mode yes
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Security (password set via --requirepass flag in docker-compose)
