version: 2
updates:
  # 1. GitHub Actions Ecosystem
  - package-ecosystem: 'github-actions'
    directory: '/'
    cooldown:
      default-days: 7
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: 'gitleaks/gitleaks-action'

  # 2. Infra / Docker Ecosystem
  - package-ecosystem: 'docker'
    directory: '/infra/dockerfiles'
    cooldown:
      default-days: 7
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'chore'
    labels:
      - 'dependencies'
    open-pull-requests-limit: 3
