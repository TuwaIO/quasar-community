<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.5" />

  <!-- Outer Orbital Track -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Inner Orbital Track -->
  <circle cx="256" cy="256" r="116" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Core Geometric Node Structure -->
  <g transform="translate(256, 256)" filter="url(#coreGlow)">
    <!-- Outer Diamond Lattice -->
    <path d="M0 -104 L104 0 L0 104 L-104 0 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round" />

    <!-- Secondary Rotated Diamond Grid -->
    <path d="M0 -76 L76 0 L0 76 L-76 0 Z" fill="url(#primaryGrad)" fill-opacity="0.12" stroke="url(#primaryGrad)" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 4" />

    <!-- Center Pulse Nexus -->
    <circle cx="0" cy="0" r="28" fill="url(#accentGrad)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.9" />

    <!-- Nodal Vertices -->
    <circle cx="0" cy="-104" r="8" fill="#38bdf8" />
    <circle cx="104" cy="0" r="8" fill="#38bdf8" />
    <circle cx="0" cy="104" r="8" fill="#38bdf8" />
    <circle cx="-104" cy="0" r="8" fill="#38bdf8" />

    <!-- Polar Node Pins -->
    <line x1="0" y1="-104" x2="0" y2="-132" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-132" r="4" fill="#38bdf8" />
    <line x1="104" y1="0" x2="132" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="132" cy="0" r="4" fill="#38bdf8" />
    <line x1="0" y1="104" x2="0" y2="132" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="132" r="4" fill="#38bdf8" />
    <line x1="-104" y1="0" x2="-132" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="-132" cy="0" r="4" fill="#38bdf8" />
  </g>
</svg>
