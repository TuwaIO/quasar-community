  redis-api-node-6:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf --cluster-enabled ${REDIS_API_CLUSTER_ENABLED:-no} --requirepass ${REDIS_API_PASSWORD} --masterauth ${REDIS_API_PASSWORD} --cluster-announce-ip 172.19.99.16 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
    volumes:
