    cpus: 0.5
    mem_limit: 1024m
    logging: *loki-logging

  redis-api-cluster-creator:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    container_name: redis-api-cluster-creator
    depends_on:
      redis-api-node-1:
        condition: service_healthy
      redis-api-node-2:
        condition: service_healthy
      redis-api-node-3:
        condition: service_healthy
      redis-api-node-4:
        condition: service_healthy
      redis-api-node-5:
        condition: service_healthy
      redis-api-node-6:
        condition: service_healthy
    networks:
      - backend_net
    environment:
      REDIS_CLUSTER_ENABLED: ${REDIS_API_CLUSTER_ENABLED:-no}
      REDIS_PASSWORD: ${REDIS_API_PASSWORD}
    command:
      - sh
      - -c
      - |
        if [ "$$REDIS_CLUSTER_ENABLED" = "yes" ]; then
          echo "Waiting for all API Redis nodes to be responsive..."
          for node in redis-api-node-1 redis-api-node-2 redis-api-node-3 redis-api-node-4 redis-api-node-5 redis-api-node-6; do
            until redis-cli -a "$$REDIS_PASSWORD" -h "$$node" ping | grep -q PONG; do
              echo "Waiting for $$node..."
              sleep 1
            done
            echo "$$node is up!"
          done

          echo "All API Redis nodes are responsive. Checking cluster state..."
          sleep 2

          # Check if cluster is already healthy and all 16384 slots are covered
          if redis-cli -a "$$REDIS_PASSWORD" -h redis-api-node-1 cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
            echo "API Redis Cluster already exists and is healthy (cluster_state:ok). No action required."
            exit 0
          fi

          echo "Cluster not healthy or not initialized. Checking if nodes are unconfigured..."
          UNCONFIGURED=1
          for node in redis-api-node-1 redis-api-node-2 redis-api-node-3 redis-api-node-4 redis-api-node-5 redis-api-node-6; do
            KNOWN=$$(redis-cli -a "$$REDIS_PASSWORD" -h "$$node" cluster info 2>/dev/null | awk -F: '$$1 == "cluster_known_nodes" {print $$2}' | tr -d '\r')
            SLOTS=$$(redis-cli -a "$$REDIS_PASSWORD" -h "$$node" cluster info 2>/dev/null | awk -F: '$$1 == "cluster_slots_assigned" {print $$2}' | tr -d '\r')
            if [ "$$KNOWN" != "1" ] || [ "$$SLOTS" != "0" ]; then
              UNCONFIGURED=0
              break
            fi
          done

          if [ "$$UNCONFIGURED" = "1" ]; then
            echo "All 6 nodes are clean and unconfigured. Initializing API Redis Cluster..."
            redis-cli -a "$$REDIS_PASSWORD" --cluster create \
              redis-api-node-1:6379 redis-api-node-2:6379 redis-api-node-3:6379 \
              redis-api-node-4:6379 redis-api-node-5:6379 redis-api-node-6:6379 \
              --cluster-replicas 1 --cluster-yes
          else
            echo "Nodes have existing cluster state. Attempting non-destructive cluster fix..."
            redis-cli -a "$$REDIS_PASSWORD" --cluster fix redis-api-node-1:6379 --cluster-yes || true
          fi

          sleep 3
          # Health verification exit gate
          STATE=$$(redis-cli -a "$$REDIS_PASSWORD" -h redis-api-node-1 cluster info 2>/dev/null | awk -F: '$$1 == "cluster_state" {print $$2}' | tr -d '\r')
          SLOTS_OK=$$(redis-cli -a "$$REDIS_PASSWORD" -h redis-api-node-1 cluster info 2>/dev/null | awk -F: '$$1 == "cluster_slots_ok" {print $$2}' | tr -d '\r')
          KNOWN=$$(redis-cli -a "$$REDIS_PASSWORD" -h redis-api-node-1 cluster info 2>/dev/null | awk -F: '$$1 == "cluster_known_nodes" {print $$2}' | tr -d '\r')

          if [ "$$STATE" = "ok" ] && [ "$$SLOTS_OK" = "16384" ] && [ "$$KNOWN" = "6" ]; then
            echo "API Redis Cluster verified successfully: state=ok, slots=16384, nodes=6."
            exit 0
          else
            echo "ERROR: API Redis Cluster verification failed! state=$$STATE, slots=$$SLOTS_OK, nodes=$$KNOWN" >&2
            exit 1
          fi
        else
          echo "API Redis Cluster mode disabled. Skipping cluster creation."
        fi

