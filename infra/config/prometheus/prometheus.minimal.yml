# Prometheus config for the minimal single-node profile
# (infra/docker-compose.minimal.yml, profile: observability).
#
# Differs from prometheus.yml (production) because the minimal topology has
# different service names and fewer of them:
#   - one `postgres` instead of postgres-exporter-{primary,standby}
#   - one `redis-api` / `redis-ui` instead of a 6-node cluster + 2-node pair
#   - no PgBouncer, no Traefik, no Cloudflare Tunnel, no Blackbox probes
#
# There is no `alerting:` block and no rule_files: Alertmanager is not part of
# the minimal profile (it needs a Discord/Telegram channel to do anything).
# Grafana's own alerting still works against these datasources.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    # Only the cAdvisor series the rules and dashboards read. Every other one is multiplied by each container (rolling
    # deploys, one-off migration runs) and pushed Prometheus past its memory limit on staging (OOM loop, 2026-10-18)
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'container_(cpu_usage_seconds_total|cpu_user_seconds_total|cpu_system_seconds_total|memory_rss|memory_working_set_bytes|memory_cache|memory_usage_bytes|spec_memory_limit_bytes|oom_events_total|network_receive_bytes_total|network_transmit_bytes_total|fs_reads_bytes_total|fs_writes_bytes_total|last_seen)|machine_.+|cadvisor_version_info'
        action: keep

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-api'
    static_configs:
      - targets: ['redis-exporter-api:9121']

  - job_name: 'redis-ui'
    static_configs:
      - targets: ['redis-exporter-ui:9121']

  # The app and engine are discovered through the Docker socket proxy, so the
  # job keeps working if containers are replaced or scaled.
  - job_name: 'quasar-nest'
    metrics_path: '/metrics'
    docker_sd_configs:
      - host: http://docker-proxy:2375
        # Containers come and go on each deploy: a removed one must leave the targets well within the 1 minute
        # of InstanceDown (the default of 60 s kept scraping it and fired the alert on every rollout)
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: 'quasar-nest-api|quasar-worker'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      - source_labels: [__meta_docker_network_ip]
        regex: '(.+)'
        replacement: '$1:3001'
        target_label: __address__

  - job_name: 'quasar-app'
    metrics_path: '/api/metrics'
    docker_sd_configs:
      - host: http://docker-proxy:2375
        # Containers come and go on each deploy: a removed one must leave the targets well within the 1 minute
        # of InstanceDown (the default of 60 s kept scraping it and fired the alert on every rollout)
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: 'quasar-app'
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      - source_labels: [__meta_docker_network_ip]
        regex: '(.+)'
        replacement: '$1:3000'
        target_label: __address__
