# Cluster (dynamically enabled via command flags in docker-compose)
# cluster-enabled managed via REDIS_CLUSTER_ENABLED env
cluster-allow-reads-when-down no
cluster-config-file nodes.conf
cluster-node-timeout 5000
cluster-announce-bus-port 16379

# Memory
maxmemory 1gb
maxmemory-policy noeviction

# Durability
appendonly yes
appendfsync everysec
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Network
bind 0.0.0.0
protected-mode yes
tcp-keepalive 300
timeout 0

# Logging
loglevel notice

# Security (password set via --requirepass flag in docker-compose)
