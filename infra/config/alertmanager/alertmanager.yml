global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'notify'
  routes:
    # Dead-man's switch: Watchdog always fires, and goes every minute to an external heartbeat monitor
    # (ALERTMANAGER_HEARTBEAT_URL, e.g. UptimeRobot), which alerts when the minutes stop: the host, Prometheus or
    # Alertmanager is down, and no other alert could tell. Without the URL it goes nowhere.
    - match:
        alertname: Watchdog
      receiver: 'heartbeat'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m

    # Critical severity alerts: faster delivery and shorter repeat interval
    - match:
        severity: critical
      receiver: 'notify'
      group_wait: 15s
      repeat_interval: 1h

    # Business & quota warnings
    - match:
        category: business
      receiver: 'notify'
      group_wait: 1m
      repeat_interval: 4h

inhibit_rules:
  # Inhibit warnings when a critical alert on the same alertname/instance is already firing
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']

  # Inhibit host/container alerts when the core service is reported down
  - source_match:
      alertname: PostgreSQLDown
    target_match:
      alertname: PostgresConnectionsHigh
    equal: ['instance']

receivers:
  - name: 'heartbeat'
    # __HEARTBEAT_RECEIVER_CONFIGS__ (this line becomes the webhook at container start, see docker-compose.yml)

  - name: 'notify'
    # __NOTIFY_RECEIVER_CONFIGS__ (this line becomes the Discord and Telegram configs at container start)
