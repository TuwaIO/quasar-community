    restart: unless-stopped
    command:
      - '--pgBouncer.connectionString=postgresql://${PG_USER}:${PG_PASSWORD}@pgbouncer:5432/pgbouncer?sslmode=disable'
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    logging: *loki-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.2.0@sha256:404528c1cd63c3eb882c257ae524919e4376115e6fe57befca8d603656a91a4c
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: --no-autoupdate --metrics 0.0.0.0:2000 tunnel run
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    logging: *loki-logging

  cloudflared-2:
    image: cloudflare/cloudflared:2026.2.0@sha256:404528c1cd63c3eb882c257ae524919e4376115e6fe57befca8d603656a91a4c
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: --no-autoupdate --metrics 0.0.0.0:2000 tunnel run
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    logging: *loki-logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    volumes:
      - ./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    cpus: 0.2
    mem_limit: 256m
    logging: *loki-logging

  alertmanager:
    image: prom/alertmanager:v0.28.0@sha256:d5155cfac40a6d9250ffc97c19db2c5e190c7bc57c6b67125c94903358f8c7d8
    restart: unless-stopped
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        NOTIFY_CONFIGS=""
        if [ -n "$$DISCORD_WEBHOOK_URL" ]; then
          NOTIFY_CONFIGS="$$NOTIFY_CONFIGS$$(printf '\n    discord_configs:\n      - webhook_url: "%s"\n        send_resolved: true' "$$DISCORD_WEBHOOK_URL")"
        fi
        if [ -n "$$TELEGRAM_BOT_TOKEN" ] && [ -n "$$TELEGRAM_CHAT_ID" ]; then
          NOTIFY_CONFIGS="$$NOTIFY_CONFIGS$$(printf '\n    telegram_configs:\n      - bot_token: "%s"\n        chat_id: "%s"\n        send_resolved: true' "$$TELEGRAM_BOT_TOKEN" "$$TELEGRAM_CHAT_ID")"
        fi
        if [ -z "$$NOTIFY_CONFIGS" ]; then
          echo "[Alertmanager] FATAL: set DISCORD_WEBHOOK_URL and/or TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID." >&2
          exit 1
        fi
        while IFS= read -r line || [ -n "$$line" ]; do
          case "$$line" in
            *__NOTIFY_RECEIVER_CONFIGS__*) printf '%s\n' "$$NOTIFY_CONFIGS" ;;
            *) printf '%s\n' "$$line" ;;
          esac
        done < /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
    cpus: 0.2
    mem_limit: 256m
    logging: *loki-logging

networks:
  backend_net:
    name: backend_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.99.0/24
          ip_range: 172.19.99.128/25
  public_net:
    name: public_net
    driver: bridge

