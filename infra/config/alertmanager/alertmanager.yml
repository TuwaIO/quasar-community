global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'notify'
  routes:
    # Dead-man's switch / Watchdog silent routing
    - match:
        alertname: Watchdog
      receiver: 'null-receiver'
      repeat_interval: 12h

    # Critical severity alerts: faster delivery and shorter repeat interval
    - match:
        severity: critical
      receiver: 'notify'
      group_wait: 15s
      repeat_interval: 1h

    # Business & quota warnings
    - match:
        category: business
      receiver: 'notify'
      group_wait: 1m
      repeat_interval: 4h

inhibit_rules:
  # Inhibit warnings when a critical alert on the same alertname/instance is already firing
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']

  # Inhibit host/container alerts when the core service is reported down
  - source_match:
      alertname: PostgreSQLDown
    target_match:
      alertname: PostgresConnectionsHigh
    equal: ['instance']

receivers:
  - name: 'null-receiver'

  - name: 'notify'
    __NOTIFY_RECEIVER_CONFIGS__
